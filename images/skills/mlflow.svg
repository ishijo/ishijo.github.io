<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 180" width="150" height="180">
  <!-- Flow icon: connected nodes -->
  <circle cx="45" cy="35" r="12" fill="#0194E2"/>
  <circle cx="105" cy="35" r="12" fill="#0194E2"/>
  <circle cx="75" cy="75" r="12" fill="#0194E2"/>
  <circle cx="45" cy="115" r="12" fill="#0194E2"/>
  <circle cx="105" cy="115" r="12" fill="#0194E2"/>
  <!-- Connecting lines -->
  <line x1="45" y1="47" x2="75" y2="63" stroke="#0194E2" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="47" x2="75" y2="63" stroke="#0194E2" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="87" x2="45" y2="103" stroke="#0194E2" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="87" x2="105" y2="103" stroke="#0194E2" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner dots white -->
  <circle cx="45" cy="35" r="5" fill="white"/>
  <circle cx="105" cy="35" r="5" fill="white"/>
  <circle cx="75" cy="75" r="5" fill="white"/>
  <circle cx="45" cy="115" r="5" fill="white"/>
  <circle cx="105" cy="115" r="5" fill="white"/>
  <!-- Text -->
  <text x="75" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0194E2">MLflow</text>
</svg>